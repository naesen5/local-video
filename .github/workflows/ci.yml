name: CI

on:
  push:
    branches: [main, dev, "hammond/**"]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch diffusers transformers gradio pillow opencv-python numpy pytest pytest-cov black isort flake8

      - name: Run tests with pytest
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Check code style with black
        run: |
          python -m black --check scripts/ webui/

      - name: Check imports with isort
        run: |
          python -m isort --check-only scripts/ webui/

      - name: Lint with flake8
        run: |
          python -m flake8 scripts/ webui/ --max-line-length 120 --ignore=E501,W503,E203
